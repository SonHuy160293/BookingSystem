# Use with the application compose file and observability.override.yaml when
# observability runs as a separate Compose project. Upstream aliases and the
# gateway's trusted source address remain on the application default network.
services:
  api:
    networks:
      default: {}
      observability: {}
  migrationrunner:
    networks:
      default: {}
      observability: {}
  cinema-api:
    networks:
      default: {}
      observability: {}
  cinema-migrationrunner:
    networks:
      default: {}
      observability: {}
  api-gateway:
    networks:
      default: {}
      observability: {}

networks:
  observability:
    external: true
    name: ${OBSERVABILITY_NETWORK:-bookingsystem-observability_default}
