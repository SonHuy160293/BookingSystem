name: bookingsystem-compose
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookingsystem-identity-sqlserver
    env_file:
      - ../env/.dev.env
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  identity-migrationrunner:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: final-identity-migration
    env_file:
      - ../env/.dev.env
    depends_on:
      sqlserver:
        condition: service_healthy
    container_name: bookingsystem-identity-migrationrunner
    restart: "no"

  identity-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: final-identity-api
    container_name: bookingsystem-identity-api
    env_file:
      - ../env/.dev.env
    ports:
      - "8080:8080"
    volumes:
      - api-uploads:/app/wwwroot/uploads
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      identity-migrationrunner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    
  cinema-postgres:
    image: postgres:17-alpine
    container_name: bookingsystem-cinema-postgres
    env_file:
      - ../env/.cinema.dev.env
    ports:
      - "5432:5432"
    volumes:
      - cinema-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  cinema-migrationrunner:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: final-cinema-migration
    container_name: bookingsystem-cinema-migrationrunner
    env_file:
      - ../env/.cinema.dev.env
    depends_on:
      cinema-postgres:
        condition: service_healthy
    restart: "no"

  cinema-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: final-cinema-api
    container_name: bookingsystem-cinema-api
    env_file:
      - ../env/.cinema.dev.env
    ports:
      - "8081:8080"
    restart: unless-stopped
    depends_on:
      cinema-postgres:
        condition: service_healthy
      cinema-migrationrunner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  sqlserver-data:
  api-uploads:
  cinema-postgres-data:
