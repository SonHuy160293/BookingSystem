name: bookingsystem-compose
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookingsystem-identity-sqlserver
    env_file:
      - ../env/.dev.env
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrationrunner:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: final-migration
    env_file:
      - ../env/.dev.env
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: final-api
    container_name: bookingsystem-identity-api
    env_file:
      - ../env/.dev.env
    environment:
      ForwardedHeaders__KnownProxies__0: ${GATEWAY_IPV4:-172.30.50.10}
    ports:
      - "8080:8080"
    volumes:
      - api-uploads:/app/wwwroot/uploads
    networks:
      default:
        aliases:
          - identity-upstream
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      migrationrunner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cinema-postgres:
    image: postgres:17-alpine
    env_file:
      - ../env/.cinema.dev.env
    ports:
      - "5432:5432"
    volumes:
      - cinema-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cinema-migrationrunner:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: final-cinema-migration
    env_file:
      - ../env/.cinema.dev.env
    depends_on:
      cinema-postgres:
        condition: service_healthy
    restart: "no"

  cinema-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: final-cinema-api
    env_file:
      - ../env/.cinema.dev.env
    environment:
      ForwardedHeaders__KnownProxies__0: ${GATEWAY_IPV4:-172.30.50.10}
      IdentityIntegration__BaseUrl: http://identity-upstream:8080
    ports:
      - "8081:8080"
    networks:
      default:
        aliases:
          - cinema-upstream
    depends_on:
      cinema-postgres:
        condition: service_healthy
      cinema-migrationrunner:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: final-gateway
    env_file:
      - ../env/.gateway.dev.env
    environment:
      services__identity-api__http__0: http://identity-upstream:8080
      services__cinema-api__http__0: http://cinema-upstream:8080
    ports:
      - "8082:8080"
    networks:
      default:
        ipv4_address: ${GATEWAY_IPV4:-172.30.50.10}
    depends_on:
      api:
        condition: service_healthy
      cinema-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  default:
    ipam:
      config:
        - subnet: ${GATEWAY_NETWORK_SUBNET:-172.30.50.0/24}
          # Keep dynamic endpoints away from the trusted static gateway address.
          ip_range: ${GATEWAY_NETWORK_DYNAMIC_RANGE:-172.30.50.128/25}

volumes:
  sqlserver-data:
  api-uploads:
  cinema-postgres-data:
